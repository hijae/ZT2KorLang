name: Create Archive
on:
  push:
    branches:
      main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
    
    - name: Get current date
      id: date
      run: echo "::set-output name=date::$(date +'%Y-%m-%d')"
 
    - uses: actions/checkout@master
    - name: Archive Release
      uses: thedoctor0/zip-release@main
      with:
        type: 'zip'
        filename: 'ZZZZZZKorlang${{ steps.date.outputs.date }}.z2f'
        path: 'lang config'
        

    - name: Build Korean supplement
      run: python3 complete-korean/build_patch.py

    - name: Upload Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "ZZZZZZKorlang${{ steps.date.outputs.date }}.z2f,complete-korean/ZZZZZZZZ_Korlang_Complete_20261007.z2f"
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ver-${{ steps.date.outputs.date }}
        name: ZT2 Korean Patch ${{ steps.date.outputs.date }}
